run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic
    - gosec
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  # Note: typecheck is not enabled to avoid Go version compatibility issues

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  govet:
    check-shadowing: true

  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false

  gosec:
    excludes:
      - G104  # Unhandled errors (covered by errcheck)

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
